<title id="title">Printable specimen-label tent</title><desc id="desc">An 80 by 130 millimetre net: three 80 by 40 millimetre panels and an 80 by 10 millimetre glue tab. Fold at 40, 80 and 120 millimetres. Assembly directions and a fifty millimetre calibration bar are on this A4 sheet.</desc>
<defs><pattern id="hatch" width="2" height="2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="2" stroke="#91a197" stroke-width=".32"/></pattern></defs>
<text x="18" y="18" font-size="2.6" letter-spacing=".8">STUDY COLLECTION / PAPER OBJECTS</text><text x="18" y="31" class="serif" font-size="8">A label, folded.</text><text x="18" y="39" font-size="3.3" class="muted">Triangular specimen tent · 80 mm long · Open ends</text><line x1="18" y1="46" x2="192" y2="46" class="rule"/>
<!-- One SVG unit equals one millimetre. Net origin (23,65). -->
<path d="M23 61V57M103 61V57M23 59H103" class="dim"/><rect x="54" y="56.5" width="18" height="5" fill="white"/><text x="63" y="60" text-anchor="middle" class="small">80 mm</text>
<g id="net" transform="translate(23 65)">

<rect id="panel-3-rear" x="0" y="80" width="80" height="40" fill="#fff"/>
<rect id="glue-tab" x="0" y="120" width="80" height="10" fill="url(#hatch)"/>
<rect x="0" y="0" width="80" height="130" fill="none" stroke="#263832" stroke-width=".35"/>
<path id="folds" d="M0 40H80M0 80H80M0 120H80" class="fold"/>

<text x="7" y="20" class="serif" font-size="5.5">River-worn slate</text>
<text x="7" y="27" font-size="3">Collected beside the Alder footbridge</text>
<text x="7" y="34" font-size="2.7" class="muted">Study collection · 2026</text>
<rect x="26" y="123" width="28" height="4" fill="white"/><text x="40" y="126" text-anchor="middle" class="tiny">GLUE THIS FACE</text>

<g class="dim"><path d="M106 65H110M106 105H110M106 145H110M106 185H110M106 195H110M108 65V195"/></g><g class="tiny muted"><text x="110" y="86">40</text><text x="110" y="126">40</text><text x="110" y="166">40</text><text x="110" y="191">10</text><text x="107" y="201">mm</text></g>
<text x="124" y="60" font-size="3.5" font-weight="bold">MAKE THE TENT</text>
<text x="124" y="69" class="body" font-weight="bold">01 / Print &amp; check</text><text x="124" y="75" class="small"><tspan x="124">Use A4, actual size (100%).</tspan><tspan x="124" dy="4.4">Turn off “Fit to page” and</tspan><tspan x="124" dy="4.4">browser headers and footers.</tspan><tspan x="124" dy="4.4">Check the 50 mm bar below.</tspan></text>
<text x="124" y="98" class="body" font-weight="bold">02 / Cut &amp; crease</text><text x="124" y="104" class="small"><tspan x="124">Cut only the solid outline.</tspan><tspan x="124" dy="4.4">Score all three dashed lines</tspan><tspan x="124" dy="4.4">with a ruler and blunt tool.</tspan><tspan x="124" dy="4.4">Fold with print on the outside.</tspan></text>
<text x="124" y="127" class="body" font-weight="bold">03 / Join at the ridge</text><text x="124" y="133" class="small"><tspan x="124">Panel 2 sits flat on the table.</tspan><tspan x="124" dy="4.4">Bring panels 1 and 3 together.</tspan><tspan x="124" dy="4.4">Glue the hatched tab inside</tspan><tspan x="124" dy="4.4">panel 1, behind its free top</tspan><tspan x="124" dy="4.4">edge. Align that edge with</tspan><tspan x="124" dy="4.4">the panel 3 / tab fold. Hold</tspan><tspan x="124" dy="4.4">until set. Leave ends open.</tspan></text>
<text x="124" y="174" class="tiny muted">YOU NEED</text><text x="124" y="180" class="small"><tspan x="124">Light card, scissors, ruler,</tspan><tspan x="124" dy="4.4">blunt scoring tool and glue.</tspan></text>
<text x="23" y="211" class="tiny muted" letter-spacing=".5">LINE KEY</text><path d="M23 218H35" stroke="#263832" stroke-width=".35"/><text x="39" y="219" class="small">Cut</text><path d="M58 218H70" class="fold"/><text x="74" y="219" class="small">Fold</text><rect x="23" y="224" width="12" height="4" fill="url(#hatch)" stroke="#89958d" stroke-width=".2"/><text x="39" y="228" class="small">Glue area</text>
<text x="124" y="205" class="tiny muted" letter-spacing=".5">ASSEMBLED / END VIEW</text>
