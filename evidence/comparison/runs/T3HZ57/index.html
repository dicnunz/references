<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>River-worn slate · Specimen tent</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8e9e5;color:#263a35;font-family:Arial,Helvetica,sans-serif}.tools{max-width:794px;margin:24px auto 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 4px}.tools p{margin:0;font-size:13px;line-height:1.5}.tools strong{display:block;font-size:14px}button{border:0;border-radius:4px;background:#294b40;color:white;padding:12px 19px;font:600 13px Arial;cursor:pointer;white-space:nowrap}button:hover{background:#17372c}button:focus-visible{outline:3px solid #aa793e;outline-offset:3px}.sheet{width:210mm;max-width:calc(100% - 24px);margin:0 auto 32px;background:white;box-shadow:0 3px 22px #253b3515}.sheet svg{display:block;width:100%;height:auto}svg text{font-family:Arial,Helvetica,sans-serif;fill:#283b35}.muted{fill:#62716a}.fine{font-size:2.5px}.body{font-size:3px}.cut{fill:none;stroke:#263a35;stroke-width:.35}.fold{fill:none;stroke:#52665c;stroke-width:.28;stroke-dasharray:2 1.4}.dim{fill:none;stroke:#8b9690;stroke-width:.2}.rule{stroke:#c9d0cb;stroke-width:.2}@media(max-width:500px){.tools{margin:16px 14px 14px;align-items:center}.tools p{font-size:11px}.tools strong{font-size:12px}.sheet{max-width:calc(100% - 16px)}button{padding:11px 13px}}@page{size:A4 portrait;margin:0}@media print{html,body{width:210mm;height:297mm;margin:0;background:white}.tools{display:none}.sheet{width:210mm;max-width:none;margin:0;box-shadow:none;height:297mm}.sheet svg{width:210mm;height:297mm;print-color-adjust:exact;-webkit-print-color-adjust:exact}}

<div class="tools"><p><strong>Specimen-label tent</strong>A4 · Print at 100% / actual size</p><button onclick="window.print()">Print template</button></div>
<main class="sheet" aria-label="Printable A4 specimen-label tent template"><svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img" aria-labelledby="title desc">
<title id="title">River-worn slate specimen-label tent</title><desc id="desc">An 80 by 130 millimeter net with three 40 millimeter panels and a 10 millimeter glue tab. Cut the solid outline and fold at 40, 80 and 120 millimeters from its top. Glue the tab inside panel A at its top edge to form a triangular prism.</desc>
<defs><pattern id="hatch" width="2" height="2" patternUnits="userSpaceOnUse"><path d="M-1 1L1 -1M0 2L2 0M1 3L3 1" stroke="#b1bdb3" stroke-width=".22"/></pattern></defs>
<text x="20" y="19" font-size="2.8" letter-spacing=".8">STUDY COLLECTION</text><text x="190" y="19" font-size="2.8" text-anchor="end" class="muted">PAPER OBJECT / 01</text>
<path d="M20 24H190" class="rule"/>
<text x="20" y="35" font-size="6.4" font-weight="600" letter-spacing="-.15">A label that stands.</text>
<text x="20" y="41" class="body muted">Cut, fold and join a small specimen tent.</text>
<!-- All coordinates are in millimeters. Net: x=20, y=55, width=80, height=130. -->
<path d="M20 48V52M100 48V52M20 50H100" class="dim"/>
<rect x="52" y="47.5" width="16" height="4" fill="white"/><text x="60" y="50.5" text-anchor="middle" class="fine muted">80 mm</text>
<path d="M13 55H17M13 185H17M15 55V185" class="dim"/>
<text x="11.5" y="120" transform="rotate(-90 11.5 120)" text-anchor="middle" class="fine muted">130 mm overall</text>
<g id="net" data-width-mm="80" data-height-mm="130">
<rect id="panel-a" x="20" y="55" width="80" height="40" fill="#fff" data-panel="A"/>
<rect id="panel-b" x="20" y="95" width="80" height="40" fill="#f5f6f3" data-panel="B"/>
<rect id="panel-c" x="20" y="135" width="80" height="40" fill="#fff" data-panel="C"/>
<rect id="glue-tab" x="20" y="175" width="80" height="10" fill="url(#hatch)"/>
<rect id="outer-cut" x="20" y="55" width="80" height="130" class="cut"/>
<path id="fold-1" d="M20 95H100" class="fold"/><path id="fold-2" d="M20 135H100" class="fold"/><path id="fold-3" d="M20 175H100" class="fold"/>
<text x="27" y="63" font-size="2.2" letter-spacing=".65">GEOLOGY / 001</text>
<text x="27" y="73" font-size="5" font-weight="600" letter-spacing="-.12">River-worn slate</text>
<text x="27" y="80" font-size="2.65">Collected beside the Alder footbridge</text>
<path d="M27 84H37" stroke="#7d8f80" stroke-width=".35"/>
<text x="27" y="90" font-size="2.6" class="muted">Study collection · 2026</text>
<text x="60" y="116" text-anchor="middle" font-size="2.7" letter-spacing=".5" class="muted">B / BASE</text>
<text x="60" y="156" text-anchor="middle" font-size="2.7" letter-spacing=".5" class="muted">C / BACK</text>
<rect x="39" y="178" width="42" height="4" fill="white"/><text x="60" y="181" text-anchor="middle" font-size="2.5">GLUE TAB · INSIDE A</text>
</g>
<text x="103" y="76" class="fine muted">A</text><text x="103" y="116" class="fine muted">40</text><text x="103" y="156" class="fine muted">40</text><text x="103" y="182" class="fine muted">10</text>
<text x="114" y="56" font-size="2.6" letter-spacing=".6" font-weight="600">ASSEMBLY</text>
<text x="114" y="66" font-size="3.5" font-weight="600">01 / Print &amp; check</text>
<text x="114" y="73" class="body"><tspan x="114">Use A4 paper or light card.</tspan><tspan x="114" dy="4.7">Choose 100% / actual size.</tspan><tspan x="114" dy="4.7">Disable “fit to page” and headers.</tspan><tspan x="114" dy="4.7">Check the 50 mm bar with a ruler.</tspan></text>
<text x="114" y="102" font-size="3.5" font-weight="600">02 / Cut &amp; fold</text>
<text x="114" y="109" class="body"><tspan x="114">Cut only the solid outer rectangle.</tspan><tspan x="114" dy="4.7">Score the three dashed lines,</tspan><tspan x="114" dy="4.7">then fold with print facing out.</tspan><tspan x="114" dy="4.7">A is the front; B sits on the table.</tspan></text>
<text x="114" y="138" font-size="3.5" font-weight="600">03 / Close the tent</text>
<text x="114" y="145" class="body"><tspan x="114">Apply glue to the hatched face.</tspan><tspan x="114" dy="4.7">Tuck the tab inside panel A.</tspan><tspan x="114" dy="4.7">Align A’s top cut edge with the</tspan><tspan x="114" dy="4.7">C/tab fold at the apex. Press</tspan><tspan x="114" dy="4.7">together and let the glue set.</tspan></text>
<text x="20" y="198" font-size="2.6" letter-spacing=".5" font-weight="600">SCALE CHECK</text>
<path d="M20 205H70M20 202.5V207.5M70 202.5V207.5" stroke="#263a35" stroke-width=".4" fill="none"/>
<text x="20" y="213" class="fine muted">0</text><text x="70" y="213" text-anchor="end" class="fine muted">50 mm</text>
<text x="20" y="222" class="body muted"><tspan x="20">The bar must measure exactly 50 mm.</tspan><tspan x="20" dy="4.7">Each full panel is 80 × 40 mm.</tspan></text>
<text x="114" y="185" font-size="2.6" letter-spacing=".5" font-weight="600">ASSEMBLED / OPEN ENDS</text>
<!-- Triangular end section is equilateral: 32 units side, 27.713 units high.
     Extrusion vector (40,-10) is schematic perspective of the 80 mm length. -->

<path d="M119 228L135 200.287L175 190.287L159 218Z" fill="#fafbf7"/>

<path d="M135 200.287L175 190.287" stroke-width=".7"/>
</g>
<text x="148" y="208" font-size="4" transform="rotate(-14 148 208)">A</text><text x="176" y="212" font-size="3.3">C</text><text x="135" y="233" font-size="2.8" text-anchor="middle">B / base</text>
<text x="114" y="241" class="fine muted">80 mm long · 40 mm base · ≈35 mm high</text>

<text x="20" y="258" font-size="2.6" letter-spacing=".5" font-weight="600">LINE KEY</text>
<path d="M20 265H33" class="cut"/><text x="37" y="266" class="body">Cut</text>

<path d="M20 277H190" class="rule"/><text x="20" y="284" class="fine muted">STUDY COLLECTION · 2026</text><text x="190" y="284" text-anchor="end" class="fine muted">A4 / 210 × 297 mm</text>
</svg></main></body></html>
